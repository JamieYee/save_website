<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞飞记账</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" sizes="any" href="favicon.ico" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="images/save.png" alt="Save App Logo" class="logo-icon" />
            </div>
            <a href="#" class="nav-link">帮助文档</a>
        </header>

        <section class="hero">
            <div class="hero-content">
                <div class="hero-image">
                    <img src="images/screenshot.webp" alt="App Screenshot" class="fade-in" style="max-width: 300px" />
                </div>
                <div class="hero-text">
                    <h1 class="app-title">飞飞记账</h1>
                    <p class="app-description">存一点，稳一点，未来多一点</p>
                    <div class="download-buttons">
                        <a href="#" class="download-button">
                            <img src="images/appstore.webp" alt="Download on the App Store" />
                        </a>
                        <a href="#" class="download-button">
                            <img src="images/googleplay.webp" alt="Get it on Google Play" />
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <script>
                document.write(
                    `<span style="color: #000; font-size: 15px;">© ${new Date().getFullYear()} 飞飞记账. 保留所有权利。</span>`
                );
            </script>
        </footer>
    </div>
    <script src="js/index_i18n.js"></script>
</body>

</html>
